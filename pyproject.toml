[project]
name = "local-siem-agent"
version = "0.1.0"
description = "Local SIEM alert investigation agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",  # imported directly for IntegrityError; also a sqlmodel dep
    "sqlmodel>=0.0.16,<0.1",
    "httpx>=0.27,<1",
    "openai>=1.50,<2",
    "typer>=0.12,<1",
    "rich>=13,<15",  # imported directly for the --tui live view; also a typer dep
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "respx>=0.21,<1",
    "freezegun>=1.4,<2",
]

[project.scripts]
agent = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
